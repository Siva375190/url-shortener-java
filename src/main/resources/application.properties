spring.application.name=url-shortener

server.port=${PORT:8080}
app.base-url=${BASE_URL:http://localhost:8080}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/urlshortener;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Optional H2 web console for inspecting the DB during development
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
